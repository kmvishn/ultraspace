# /etc/ultraspace/config.toml

# Keep this on loopback; nginx terminates HTTPS in front of it.
listen = "127.0.0.1:4600"

# Database and setup token live here.
data_dir = "/var/lib/ultraspace"

# The file manager is confined to this folder (default: <data_dir>/files).
# files_root = "/var/lib/ultraspace/files"

# The public URL, accepted in Origin checks.
public_origin = "https://ultraspace.example.com"

# Trust X-Forwarded-Proto / X-Real-IP from nginx on 127.0.0.1.
trust_proxy = true

session_ttl = "720h"

# How big the heavy apps may get: "auto" picks from total RAM ("tiny" up to 700 MB,
# "small" up to 1.5 GB, "normal" above). It sets how many browser tabs stay loaded,
# Chrome's process limit, and how soon idle Chrome and VS Code shut down.
memory_profile = "auto"

# Remote browser for the Browser app (chrome-headless-shell from Chrome for Testing).
[browser]
chrome = "/opt/ultraspace/chrome/chrome-headless-shell"
# idle = "5m"   # default comes from memory_profile

# BitTorrent client for the Torrents app and Stremio torrent streams. Downloads go to
# Files → Torrents. Open the port (TCP and UDP) in the firewall for faster downloads.
[torrent]
port = 42069
seed_ratio = 1.0
# disabled = true
